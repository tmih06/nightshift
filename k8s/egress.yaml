# Lightweight single-pod egress + credential-injection proxy for Nightshift.
# Apply via k8s/egress-setup.sh (generates the CA and real Secrets first).
apiVersion: v1
kind: Namespace
metadata:
  name: nightshift-egress
  labels:
    kubernetes.io/metadata.name: nightshift-egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-policy
  namespace: nightshift-egress
data:
  policy.yaml: |
    ca:
      cert_file: /etc/egress-ca/ca.crt
      key_file: /etc/egress-ca/ca.key
    block_private_ips: true
    scrub_responses: true
    rules:
      - name: anthropic
        hosts: ["api.anthropic.com"]
        ports: [443]
        mode: mitm
        secrets: ["ANTHROPIC_API_KEY", "CLAUDE_ACCESS_TOKEN"]
      - name: chatgpt
        hosts: ["chatgpt.com"]
        ports: [443]
        mode: mitm
        secrets: ["CODEX_ACCESS_TOKEN"]
      - name: antigravity
        hosts:
          - "cloudcode-pa.googleapis.com"
          - "daily-cloudcode-pa.googleapis.com"
          - "aicode.googleapis.com"
        ports: [443]
        mode: mitm
        secrets: ["AGY_ACCESS_TOKEN"]
      # agy asks who its token belongs to, and Google would name the real
      # account. The proxy answers with no identity and forwards nothing.
      - name: antigravity-userinfo
        hosts: ["www.googleapis.com"]
        ports: [443]
        mode: mitm
        methods: ["GET"]
        path_prefixes: ["/oauth2/v2/userinfo", "/oauth2/v3/userinfo"]
        answers:
          /oauth2/v2/userinfo: "{}"
          /oauth2/v3/userinfo: "{}"
      - name: openai
        hosts: ["api.openai.com"]
        ports: [443]
        mode: mitm
        secrets: ["OPENAI_API_KEY"]
      - name: google-ai
        hosts: ["generativelanguage.googleapis.com"]
        ports: [443]
        mode: mitm
        secrets: ["GEMINI_API_KEY"]
      - name: github
        hosts: ["github.com", "api.github.com"]
        ports: [443]
        mode: mitm
        methods: ["GET", "HEAD", "POST", "PUT", "PATCH"]
        secrets: ["GITHUB_TOKEN"]
      - name: npm
        hosts: ["registry.npmjs.org"]
        ports: [443]
        mode: tunnel
      - name: pypi
        hosts: ["pypi.org", "files.pythonhosted.org"]
        ports: [443]
        mode: tunnel
      - name: golang
        hosts: ["proxy.golang.org", "sum.golang.org"]
        ports: [443]
        mode: tunnel
    secrets:
      ANTHROPIC_API_KEY:
        placeholder: "nightshift:secret:ANTHROPIC_API_KEY"
        env: "REAL_ANTHROPIC_API_KEY"
      OPENAI_API_KEY:
        placeholder: "nightshift:secret:OPENAI_API_KEY"
        env: "REAL_OPENAI_API_KEY"
      GEMINI_API_KEY:
        placeholder: "nightshift:secret:GEMINI_API_KEY"
        env: "REAL_GEMINI_API_KEY"
      GITHUB_TOKEN:
        placeholder: "nightshift:secret:GITHUB_TOKEN"
        env: "REAL_GITHUB_TOKEN"
      # OAuth access tokens rotate: creds-publish.sh rewrites them in
      # egress-secrets and the proxy re-reads these files without a restart.
      CLAUDE_ACCESS_TOKEN:
        placeholder: "nightshift:secret:CLAUDE_ACCESS_TOKEN"
        file: "/etc/egress-secrets/REAL_CLAUDE_ACCESS_TOKEN"
        label_file: "/etc/egress-secrets/LABEL_CLAUDE_ACCESS_TOKEN"
        pool_file: "/etc/egress-secrets/POOL_CLAUDE_ACCESS_TOKEN"
      CODEX_ACCESS_TOKEN:
        placeholder: "nightshift:secret:CODEX_ACCESS_TOKEN"
        file: "/etc/egress-secrets/REAL_CODEX_ACCESS_TOKEN"
        label_file: "/etc/egress-secrets/LABEL_CODEX_ACCESS_TOKEN"
        pool_file: "/etc/egress-secrets/POOL_CODEX_ACCESS_TOKEN"
      AGY_ACCESS_TOKEN:
        placeholder: "nightshift:secret:AGY_ACCESS_TOKEN"
        file: "/etc/egress-secrets/REAL_AGY_ACCESS_TOKEN"
        label_file: "/etc/egress-secrets/LABEL_AGY_ACCESS_TOKEN"
        pool_file: "/etc/egress-secrets/POOL_AGY_ACCESS_TOKEN"
---
---
# Static egress environment shared by every sandbox template through
# envFrom. Placeholder values are only meaningful to the egress proxy;
# on any direct connection they are worthless sentinels. The proxy address
# (HTTP_PROXY and friends) is not set here: egress-setup.sh patches in the
# Service's address, which differs per cluster, and a later `kubectl apply`
# leaves it alone. ANTHROPIC_API_KEY
# is absent on purpose: Claude Code gives it precedence over every OAuth
# path, so setting it would disable the credential-file and oauth-token
# flows this cluster uses.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-egress-env
  namespace: nightshift
data:
  NO_PROXY: localhost,127.0.0.1
  no_proxy: localhost,127.0.0.1
  NODE_EXTRA_CA_CERTS: /etc/nightshift/ca/ca.crt
  SSL_CERT_FILE: /etc/nightshift/ca/ca.crt
  REQUESTS_CA_BUNDLE: /etc/nightshift/ca/ca.crt
  CURL_CA_BUNDLE: /etc/nightshift/ca/ca.crt
  GIT_SSL_CAINFO: /etc/nightshift/ca/ca.crt
  OPENAI_API_KEY: nightshift:secret:OPENAI_API_KEY
  GEMINI_API_KEY: nightshift:secret:GEMINI_API_KEY
  GITHUB_TOKEN: nightshift:secret:GITHUB_TOKEN
  CLAUDE_CODE_OAUTH_TOKEN: nightshift:secret:CLAUDE_ACCESS_TOKEN
---
# SQLite usage database behind the Accounts tab. Cooldowns and the quota
# cache stay in memory.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egress-usage
  namespace: nightshift-egress
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: nightshift-egress
spec:
  replicas: 1
  # The usage volume is ReadWriteOnce and has one writer, so the old pod has to
  # go before the new one starts. rollingUpdate is cleared for clusters that
  # already hold the defaulted one.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: nightshift-egress-proxy:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: proxy
          containerPort: 8080
        - name: admin
          containerPort: 9090
        env:
        - name: EGRESS_USAGE_DB
          value: /var/lib/egress/usage.db
        - name: EGRESS_USAGE_HISTORY
          value: /var/lib/egress/usage-history.json
        envFrom:
        - secretRef:
            name: egress-secrets
            optional: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: admin
          initialDelaySeconds: 1
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: admin
          initialDelaySeconds: 3
          periodSeconds: 15
        volumeMounts:
        - name: policy
          mountPath: /etc/egress
          readOnly: true
        - name: ca
          mountPath: /etc/egress-ca
          readOnly: true
        - name: secrets
          mountPath: /etc/egress-secrets
          readOnly: true
        - name: usage
          mountPath: /var/lib/egress
      volumes:
      - name: usage
        persistentVolumeClaim:
          claimName: egress-usage
      - name: policy
        configMap:
          name: egress-policy
      - name: ca
        secret:
          secretName: egress-ca
      - name: secrets
        secret:
          secretName: egress-secrets
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: nightshift-egress
spec:
  # No clusterIP is pinned: service CIDRs differ per provider. Sandbox pods
  # use external DNS resolvers, so egress-setup.sh reads the assigned address
  # back and writes it into the sandbox-egress-env ConfigMap.
  selector:
    app: egress-proxy
  ports:
  - name: proxy
    port: 8080
    targetPort: proxy
---
# Allow only nightshift pods to reach the proxy listener (port 8080).
# Admin port 9090 is intentionally unreachable from nightshift.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy-ingress
  namespace: nightshift-egress
spec:
  podSelector:
    matchLabels:
      app: egress-proxy
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nightshift
    ports:
    - protocol: TCP
      port: 8080
---
# Let every sandbox pod in nightshift reach the egress proxy. The agent-sandbox
# controller generates per-template NetworkPolicies that deny all private
# IP egress, which would otherwise make the proxy unreachable; network
# policies are union-permissive, so this additive allow is enough.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-proxy-access
  namespace: nightshift
spec:
  # Only sandbox pods. An empty selector would put every pod in the namespace
  # under an egress policy, cutting off the creds refresher's DNS and its
  # direct path to the agents' login servers.
  podSelector:
    matchExpressions:
    - key: agents.x-k8s.io/sandbox-template-ref-hash
      operator: Exists
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nightshift-egress
      podSelector:
        matchLabels:
          app: egress-proxy
    ports:
    - protocol: TCP
      port: 8080
---
# Lock down checkout sandboxes (and clone Jobs) in nightshift so their ONLY
# permitted outbound destination is the egress proxy on TCP 8080. Direct
# internet, cluster internals, cloud metadata, and UDP/TCP 53 DNS are dropped
# (Nightshift sets HTTP_PROXY/HTTPS_PROXY to the proxy's ClusterIP so all DNS
# resolution happens inside the egress proxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-volume-egress
  namespace: nightshift
spec:
  podSelector:
    matchExpressions:
    - key: nightshift.dev/volume
      operator: Exists
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nightshift-egress
      podSelector:
        matchLabels:
          app: egress-proxy
    ports:
    - protocol: TCP
      port: 8080
