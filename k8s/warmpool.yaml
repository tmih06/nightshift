apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: devin-template
  namespace: nightshift
spec:
  podTemplate:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: agent
        image: ghcr.io/tmih06/nightshift-devin:latest
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          c=/etc/nightshift/creds/creds.tar
          if [ -f "$c" ]; then
            tar -xf "$c" -C "$HOME" 2>/dev/null || true
          fi
          # Let Devin act without asking, as agy does: the sandbox and the
          # egress proxy are the guard rails. The image holds the version that
          # was built and checked, so Devin does not update itself, and it sends
          # its protobuf bodies plain so the proxy can swap its key in them. Its
          # login, a placeholder, comes with the others from nightshift-auth.
          d=$HOME/.config/devin
          mkdir -p "$d"
          jq -n '{permission_mode: "dangerous", auto_update: false,
            proxy: {gzip: false}}' > "$d/config.json"
          exec sleep infinity
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        envFrom:
        - configMapRef:
            name: sandbox-egress-env
            optional: true
        volumeMounts:
        - name: agent-creds
          mountPath: /etc/nightshift/creds
          readOnly: true
        - name: egress-ca
          mountPath: /etc/nightshift/ca
          readOnly: true
      volumes:
      - name: agent-creds
        secret:
          secretName: agent-creds
          optional: true
      - name: egress-ca
        configMap:
          name: egress-ca
          optional: true
---
