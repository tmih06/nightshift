# Generated by k8s/warmpool.sh from images/agent/agents. Do not edit by hand;
# run make warmpool. One template and one warm standby per coding agent.
# Claim a pool with k8s/claim.yaml, sbx, or the dashboard.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nightshift
  labels:
    kubernetes.io/metadata.name: nightshift
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agy-template
  namespace: nightshift
spec:
  podTemplate:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: agent
        image: ghcr.io/tmih06/nightshift-agy:latest
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          c=/etc/nightshift/creds/creds.tar
          if [ -f "$c" ]; then
            tar -xf "$c" -C "$HOME" 2>/dev/null || true
          fi
          # Open agy straight at its prompt and let it act without asking:
          # the sandbox and the egress proxy are the guard rails. agy trusts
          # a folder only by its exact path, so list home and each workspace.
          d=$HOME/.gemini/antigravity-cli
          mkdir -p "$d/cache"
          jq -n '{consumerOnboardingComplete: true,
            onboardingComplete: true}' > "$d/cache/onboarding.json"
          { echo "$HOME"; find "$HOME/workspace" -maxdepth 1 -type d; } |
            jq -Rn '{trustedWorkspaces: [inputs],
              toolPermission: "always-proceed",
              artifactReviewPolicy: "always-proceed",
              allowNonWorkspaceAccess: true}' > "$d/settings.json"
          exec sleep infinity
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        envFrom:
        - configMapRef:
            name: sandbox-egress-env
            optional: true
        volumeMounts:
        - name: agent-creds
          mountPath: /etc/nightshift/creds
          readOnly: true
        - name: egress-ca
          mountPath: /etc/nightshift/ca
          readOnly: true
      volumes:
      - name: agent-creds
        secret:
          secretName: agent-creds
          optional: true
      - name: egress-ca
        configMap:
          name: egress-ca
          optional: true
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: agy-pool
  namespace: nightshift
spec:
  updateStrategy:
    type: Recreate
  replicas: 1
  sandboxTemplateRef:
    name: agy-template
---
