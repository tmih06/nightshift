# In-cluster credential refresher. It reads the accounts you signed in to
# CLIProxyAPI (k8s/cpa.yaml), swaps each access token for a placeholder,
# publishes the sandbox copies (agent-creds) and the real access tokens
# (egress-secrets), and sizes the warm pools to the logins it finds. CLIProxyAPI
# holds the refresh tokens and keeps them fresh, so this pod holds none.
#
# Install both with k8s/creds-setup.sh, then sign accounts in on the
# CLIProxyAPI page (see the top of cpa.yaml).
#
# Several clusters, one login: mount a kubeconfig as the creds-remote
# secret (key: config) and list contexts in PUBLISH_CONTEXTS, "-" being this
# cluster. Each context's credentials need the two Roles below in that cluster.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: creds-refresher
  namespace: nightshift
  labels:
    nightshift.dev/component: creds
---
# Least privilege: the refresher edits only the credential secrets and the
# warm pool sizes, and nothing else in either namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: creds-refresher
  namespace: nightshift
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["agent-creds"]
  verbs: ["get", "patch", "update"]
# Which account each agent uses, and what was last published.
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["nightshift-accounts"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxwarmpools"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: creds-refresher
  namespace: nightshift
subjects:
- kind: ServiceAccount
  name: creds-refresher
  namespace: nightshift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: creds-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: creds-refresher
  namespace: nightshift-egress
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["egress-secrets"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: creds-refresher
  namespace: nightshift-egress
subjects:
- kind: ServiceAccount
  name: creds-refresher
  namespace: nightshift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: creds-refresher
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-creds-home
  namespace: nightshift
  labels:
    nightshift.dev/component: creds
spec:
  # The cluster's default StorageClass; set storageClassName for another.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creds-refresher
  namespace: nightshift
  labels:
    nightshift.dev/component: creds
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: creds-refresher
  template:
    metadata:
      labels:
        app: creds-refresher
        nightshift.dev/component: creds
    spec:
      serviceAccountName: creds-refresher
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: refresher
        image: ghcr.io/tmih06/nightshift-creds:latest
        imagePullPolicy: IfNotPresent
        args:
        - --cpa
        - http://cpa.nightshift.svc:8317
        - --watch
        - "300"
        env:
        - name: HOME
          value: /home/node
        - name: CPA_MANAGEMENT_KEY
          valueFrom:
            secretKeyRef:
              name: cpa-keys
              key: management
        - name: PUBLISH_CONTEXTS
          value: "-"
        - name: REMOTE_KUBECONFIG
          value: /etc/nightshift/remote/config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: home
          mountPath: /home/node
        - name: remote
          mountPath: /etc/nightshift/remote
          readOnly: true
      volumes:
      - name: home
        persistentVolumeClaim:
          claimName: agent-creds-home
      - name: remote
        secret:
          secretName: creds-remote
          optional: true
