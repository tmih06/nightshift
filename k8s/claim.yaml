# Claim Pi by default; use any <agent>-pool, such as codex-pool or devin-pool
# for another agent.
# Apply this -> instant adoption (no cold start).
# Delete this -> shutdownPolicy: Delete tears the sandbox down,
# and the pool refills a fresh warm standby automatically.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: my-agent
  namespace: nightshift
spec:
  warmPoolRef:
    name: pi-pool
  lifecycle:
    shutdownPolicy: Delete
