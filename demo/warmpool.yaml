# One template and one warm standby per coding agent.
# Claim a pool with demo/claim.yaml, sbx, or the dashboard.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-demo
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: pi-template
  namespace: sandbox-demo
spec:
  podTemplate:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: agent
        image: ghcr.io/tmih06/nightshift-pi:latest
        imagePullPolicy: Always
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 2Gi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: pi-pool
  namespace: sandbox-demo
spec:
  updateStrategy:
    type: Recreate
  replicas: 1
  sandboxTemplateRef:
    name: pi-template
---
