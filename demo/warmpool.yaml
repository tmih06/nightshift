# Standing infra: everything connected via the extensions chain.
# SandboxTemplate -> SandboxWarmPool (keeps 2 pre-warmed sandboxes ready).
# You never touch Sandboxes directly: claim one with demo/claim.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-demo
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agent-bash-template
  namespace: sandbox-demo
spec:
  podTemplate:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: agent
        # Build and load images/agent into kind first.
        image: nightshift-agent:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        resources:   # cap each sandbox so bursts can't starve the node
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: agent-pool
  namespace: sandbox-demo
spec:
  updateStrategy:
    type: Recreate
  replicas: 2
  sandboxTemplateRef:
    name: agent-bash-template
