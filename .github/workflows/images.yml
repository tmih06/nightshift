---
name: Publish sandbox images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/images.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-images
  cancel-in-progress: false

jobs:
  base:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-base" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish base
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

  agent:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: pi
            package: '@earendil-works/pi-coding-agent'
          - agent: codex
            package: '@openai/codex'
          - agent: claude-code
            package: '@anthropic-ai/claude-code'
          - agent: opencode
            package: opencode-ai
    steps:
      - uses: actions/checkout@v7
      - name: Find the latest stable release
        id: release
        env:
          PACKAGE: ${{ matrix.package }}
          AGENT: ${{ matrix.agent }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(curl --fail --silent --show-error --retry 3 "https://registry.npmjs.org/${PACKAGE}/latest" | jq -er '.version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}-${AGENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing release image
        id: check
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == schedule ]] && docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish agent
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.image }}@${{ needs.base.outputs.digest }}
            AGENT=${{ matrix.agent }}
            AGENT_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
